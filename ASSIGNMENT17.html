<!DOCTYPE html>
<html>
<head>
    <title>Assignment 17</title>
</head>
<body>

<form method="post" action="submit.php">

    <input type="text"
           placeholder="Full name"
           required
           minlength="3">

    <br><br>

    <input type="email"
           placeholder="you@college.edu"
           required>

    <br><br>

    <input type="tel"
           placeholder="10-digit mobile"
           pattern="[0-9]{10}"
           required>

    <br><br>

    <input type="password"
           placeholder="Min 6 characters"
           minlength="6"
           required>

    <br><br>

    <input type="number"
           placeholder="Age"
           min="17"
           max="30"
           required>

    <br><br>

    <button type="submit">Register</button>

</form>

</body>
</html>
