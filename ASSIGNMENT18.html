<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ABES College Admission 2026</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
}

header,footer{
    background:#1f2782;
    color:white;
    text-align:center;
    padding:20px;
}

main{
    width:80%;
    margin:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

table,th,td{
    border:1px solid gray;
    padding:10px;
}

fieldset{
    margin-top:20px;
}
</style>

</head>
<body>

<header>
    <h1>ABESEC Admission 2026</h1>
</header>

<main>

<h2>Courses and Fees</h2>

<table>
    <caption>Available Courses</caption>

    <tr>
        <th>Course</th>
        <th>Seats</th>
        <th>Fees</th>
    </tr>

    <tr>
        <td>B.Tech CSE AIML</td>
        <td>120</td>
        <td>₹90,000</td>
    </tr>

    <tr>
        <td>B.TECH ECE</td>
        <td>60</td>
        <td>₹45,000</td>
    </tr>
</table>

<form>
<fieldset>

<legend>Application Form</legend>

<label>Name:</label><br>
<input type="text" required><br><br>

<label>Email:</label><br>
<input type="email" required><br><br>

<label>Course:</label><br>
<select>
    <option>B.Tech CSE AIML</option>
    <option>B.TECH ECE</option>
</select>

<br><br>

<label>Statement:</label><br>
<textarea rows="5" cols="50"></textarea>

<br><br>

<button type="submit">Apply</button>

</fieldset>
</form>

</main>

<footer>
    &copy; 2026 ABES College
</footer>

</body>
</html>
